services:
  # ========================================================
  # PostgreSQL 16 Database
  # ========================================================
  postgres:
    image: postgres:16-alpine
    container_name: to2rent-postgres
    restart: always
    environment:
      POSTGRES_DB: to2rent_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d to2rent_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ========================================================
  # Redis 7 In-Memory Distributed Cache
  # ========================================================
  redis:
    image: redis:7-alpine
    container_name: to2rent-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ========================================================
  # Apache Kafka (KRaft mode - no zookeeper required)
  # ========================================================
  kafka:
    image: apache/kafka:latest
    container_name: to2rent-kafka
    restart: always
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
    volumes:
      - kafka_data:/var/lib/kafka/data

  # ========================================================
  # TO2RENT Microservice (.NET 9 + Frontend)
  # ========================================================
  backend:
    build:
      context: .
      dockerfile: Backend/Dockerfile
    container_name: to2rent-backend
    restart: always
    ports:
      - "5000:5000"
    volumes:
      - ./TO2RENT:/app/TO2RENT:ro
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DatabaseProvider: PostgreSQL
      ConnectionStrings__PostgreSql: Host=postgres;Port=5432;Database=to2rent_db;Username=postgres;Password=postgres
      Redis__Configuration: redis:6379
      Redis__Enabled: "true"
      Kafka__BootstrapServers: kafka:9092
      Kafka__BookingTopic: to2rent-bookings
      Kafka__InquiryTopic: to2rent-inquiries
      Kafka__ConsumerGroupId: to2rent-audit-group
      Kafka__Enabled: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started

volumes:
  postgres_data:
  kafka_data:
  redis_data:
